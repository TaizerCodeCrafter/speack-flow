<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sf-fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Emerald-Cyan S-Wave Flow Gradient -->
    <linearGradient id="sf-fav-wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Indigo-Violet Voice Pulse Gradient -->
    <linearGradient id="sf-fav-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="sf-fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#06b6d4" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#sf-fav-bg)" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle Radial Ambient Aura -->
  <circle cx="256" cy="256" r="180" fill="#06b6d4" opacity="0.12" filter="blur(35px)"/>

  <!-- Fluid S-Curve Sound Wave scaled to 512 viewBox -->
  <!-- Scaled ~4.4x centered -->
  <g transform="translate(48, 48) scale(4.16)">
    <!-- Main S Flow Wave -->
    <path
      d="M 68 22 C 48 18 26 28 26 44 C 26 58 44 60 56 64 C 68 68 74 74 74 82 C 74 92 58 96 42 92 C 34 90 28 85 24 80"
      stroke="url(#sf-fav-wave)"
      stroke-width="12"
      stroke-linecap="round"
      filter="url(#sf-fav-glow)"
    />

    <!-- Acoustic Resonance Waves -->
    <line
      x1="71"
      y1="39"
      x2="71"
      y2="57"
      stroke="url(#sf-fav-wave)"
      stroke-width="6"
      stroke-linecap="round"
    />
    <line
      x1="82"
      y1="33"
      x2="82"
      y2="63"
      stroke="url(#sf-fav-pulse)"
      stroke-width="5"
      stroke-linecap="round"
    />
    <line
      x1="92"
      y1="41"
      x2="92"
      y2="55"
      stroke="url(#sf-fav-pulse)"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Voice Nodes -->
    <circle cx="26" cy="44" r="4.5" fill="#ffffff"/>
    <circle cx="70" cy="22" r="4" fill="#ffffff"/>
  </g>
</svg>
